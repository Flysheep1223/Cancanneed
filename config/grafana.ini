[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost

[database]
type = sqlite3
wal = true

[security]
cookie_samesite = lax

[users]
allow_sign_up = false

[auth]
disable_login = true
disable_login_form = true
disable_signout_menu = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info

[log.file]
log_rotate = true
max_size_shift = 24
max_days = 7

[plugins]
preinstall_disabled = true
